name: Model performance tracking
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: propedge-model-tracking
  cancel-in-progress: false
jobs:
  capture-and-grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python track_model.py
      - name: Commit immutable pick snapshots and grades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model_tracking.json
          if ! git diff --cached --quiet; then
            git commit -m "Update model performance tracking"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
