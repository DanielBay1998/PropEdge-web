name: NBA blend comparison
on:
  workflow_dispatch:
  push:
    paths:
      - nba_blend_backtest.py
      - nba_matchup_features.py
      - nba_defense_backtest.py
      - nba_minutes_backtest.py
      - nba_integrated_role_backtest.py
      - test_nba_matchup_features.py
      - test_nba_identity_guard.py
      - server.py
      - static/index.html
      - nba_challenger_model.py
      - evaluate_capture_history.py
      - data/model_tracking.json
      - data/nba_2026_27.csv
      - data/propedge_historical_2025_26_minutes.csv
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and leakage regression tests
        run: |
          python -m py_compile test_nba_identity_guard.py server.py nba_challenger_model.py nba_matchup_features.py nba_blend_backtest.py nba_defense_backtest.py nba_minutes_backtest.py nba_integrated_role_backtest.py
          python -m unittest -v test_nba_matchup_features.py test_nba_identity_guard.py
      - name: Walk-forward defensive feature backtest
        run: python nba_defense_backtest.py
      - name: Walk-forward minutes model backtest
        run: python nba_minutes_backtest.py
      - name: Walk-forward integrated role and matchup model
        run: python nba_integrated_role_backtest.py
      - name: Compare predictions
        run: python nba_blend_backtest.py
      - name: Audit real captured picks by date and market
        run: python evaluate_capture_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-blend-backtest
          path: |
            reports/nba_blend_comparison.json
            reports/nba_defense_backtest.json
            reports/nba_minutes_backtest.json
            reports/nba_integrated_role_backtest.json
            reports/multidate_model_performance.json
