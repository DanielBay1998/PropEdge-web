name: NBA Defense Consensus Captured ROI
on:
  workflow_dispatch:
  push:
    paths:
      - nba_defense_consensus_captured_roi.py
      - .github/workflows/nba_defense_consensus_captured_roi.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate captured odds
        run: |
          python -m py_compile nba_defense_consensus_captured_roi.py
          python nba_defense_consensus_captured_roi.py
      - name: Save report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nba_defense_consensus_captured_roi.json
          git diff --cached --quiet || (git commit -m 'Update defense consensus ROI report' && git push)
