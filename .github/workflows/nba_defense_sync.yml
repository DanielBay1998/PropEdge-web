name: Sync verified NBA defensive ratings
on:
  push:
    branches: [main]
    paths:
      - 'sync_nba_dvp.py'
      - 'sync_nba_defense.py'
      - '.github/workflows/nba_defense_sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 13,19,23 * * *'
permissions:
  contents: write
concurrency:
  group: propedge-nba-defense
  cancel-in-progress: false
jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build position-specific defensive allowances
        run: python sync_nba_dvp.py
      - name: Fetch NBA.com verified advanced defensive ratings (best effort)
        run: python sync_nba_defense.py || echo 'NBA.com unavailable; preserving DvP refresh'
      - name: Commit verified snapshot only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_dvp_2026_27.json
          if [ -f data/nba_defense_2026_27.json ]; then git add data/nba_defense_2026_27.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified NBA team defensive ratings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
