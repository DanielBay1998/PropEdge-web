name: NBA Points and Threes Failure Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - nba_points_threes_failure_diagnostics.py
      - .github/workflows/nba_points_threes_failure_diagnostics.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run points and threes diagnostics
        run: |
          python -m py_compile nba_points_threes_failure_diagnostics.py
          python nba_points_threes_failure_diagnostics.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nba_points_threes_failure_diagnostics.json
          git diff --cached --quiet || (git commit -m 'Update points threes diagnostics' && git push)
