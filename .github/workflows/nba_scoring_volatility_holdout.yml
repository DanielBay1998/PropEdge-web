name: NBA Scoring Volatility Holdout
on:
  workflow_dispatch:
  push:
    paths:
      - nba_scoring_volatility_holdout.py
      - .github/workflows/nba_scoring_volatility_holdout.yml
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate scoring volatility
        run: |
          python -m py_compile nba_scoring_volatility_holdout.py
          python nba_scoring_volatility_holdout.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nba_scoring_volatility_holdout.json
          git diff --cached --quiet || (git commit -m 'Update scoring volatility holdout report' && git push)
