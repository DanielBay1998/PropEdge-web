name: NBA three-model consensus comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'nba_three_model_consensus_audit.py'
  schedule:
    - cron: '24 12 * * *'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare on captured sides and odds
        run: |
          python -m py_compile nba_three_model_consensus_audit.py
          python nba_three_model_consensus_audit.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/nba_three_model_consensus_audit.json
          git diff --cached --quiet || (git commit -m "Update three-model consensus research comparison" && git push)
