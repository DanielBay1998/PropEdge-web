name: Train NBA V4 live coefficients
on:
  push:
    paths:
      - 'nba_v4_live_train.py'
      - '.github/workflows/nba_v4_live_train.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train and check V4 coefficients
        run: |
          python -m py_compile nba_v4_live_train.py nba_v4_baseline_audit.py
          python nba_v4_live_train.py
          python -c "import json; p=json.load(open('data/nba_v4_live_coefficients.json')); assert len(p['markets'])==5"
      - name: Publish coefficients
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_v4_live_coefficients.json
          git diff --cached --quiet || (git commit -m "Refresh NBA V4 live ridge coefficients" && git push)
