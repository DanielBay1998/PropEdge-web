name: NFL board runtime regression
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('nfl.py').read_text()
          tree=ast.parse(source)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='odds_board')
          names={n.id for n in ast.walk(fn) if isinstance(n,ast.Name)}
          assert {'context_rows','for_prop','injury_block'}<=names
          assert 'from nfl_context import records,for_prop,injury_block' in source
          assert 'context_rows=records()' in source
          import nfl
          print('NFL board context dependencies available')
          PY
