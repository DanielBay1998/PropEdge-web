name: NFL production response diagnosis
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect live API and reproduce NFL board with provider fixture
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,time,json,os,sys,types,traceback
          for path in ['/healthz','/api/nfl/board']:
           try:
            start=time.monotonic()
            with urllib.request.urlopen('https://propedge-custom.onrender.com'+path,timeout=50) as r:
             body=r.read(1000000)
             print('LIVE',path,r.status,'seconds',round(time.monotonic()-start,2),'bytes',len(body),flush=True)
             if path.endswith('/board'):
              data=json.loads(body)
              print('LIVE fields',list(data),'props',len(data.get('props',[])),'top',len(data.get('top_picks',[])),'error',data.get('error'),flush=True)
           except Exception as e:print('LIVE FAIL',path,repr(e),flush=True)
          import nfl
          class FakePropLine:
           def __init__(self,key):pass
           def get_events(self,sport):return [{'id':'future','commence_time':(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(days=2)).isoformat(),'home_team':'Denver Broncos','away_team':'Kansas City Chiefs'}]
           def get_odds(self,*a,**kw):
            return {'bookmakers':[{'key':name,'markets':[{'key':'player_rushing_yards','outcomes':[{'name':'Over','description':'Kenneth Walker III','point':84.5,'price':-110}]}]} for name in ['pinnacle','betrivers']]}
          sys.modules['propline']=types.SimpleNamespace(PropLine=FakePropLine)
          os.environ['PROPLINE_API_KEY']='fixture'
          try:
           x=nfl.odds_board()
           print('FIXTURE props',len(x['props']),'picks',len(x['top_picks']),'error',x.get('error'),flush=True)
           assert len(x['props'])==1, 'Expected fixture quote to pass through NFL odds board'
          except Exception:
           traceback.print_exc()
           raise
          PY
