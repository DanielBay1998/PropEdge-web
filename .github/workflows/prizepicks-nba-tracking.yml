name: Capture and grade PrizePicks NBA
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/track_prizepicks_nba.py'
      - '.github/workflows/prizepicks-nba-tracking.yml'
permissions:
  contents: write
concurrency:
  group: prizepicks-nba-tracking
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture observed lines and grade completed games
        run: python scripts/track_prizepicks_nba.py
      - name: Save archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prizepicks_nba_tracking.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive observed PrizePicks NBA lines and grades"
            git pull --rebase
            git push
          fi
