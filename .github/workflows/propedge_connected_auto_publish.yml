name: PropEdge Connected Auto Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'
permissions:
  contents: write
concurrency:
  group: propedge-auto-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: true
      - name: Checkout private model repository
        uses: actions/checkout@v4
        with:
          repository: DanielBay1998/Prop-
          token: ${{ secrets.PROPEDGE_MODEL_REPO_TOKEN }}
          ref: main
          path: model
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install pandas numpy requests
      - name: Refresh research model
        working-directory: model
        run: python propedge_daily_pipeline.py
      - name: Build updated production copy
        run: |
          cp website/data/propedge_shadow_projections.csv /tmp/propedge_before.csv
          python website/propedge_auto_publish.py \
            --production /tmp/propedge_before.csv \
            --research model/reports/release3/research_projection_comparison.csv \
            --output website/data/propedge_shadow_projections.csv \
            --report website/reports/auto_publish_report.json
      - name: Upload backup and publish report
        uses: actions/upload-artifact@v4
        with:
          name: propedge-auto-publish-backup-and-report
          path: |
            /tmp/propedge_before.csv
            website/reports/auto_publish_report.json
          retention-days: 30
      - name: Commit website projections
        working-directory: website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/propedge_shadow_projections.csv
          if git diff --cached --quiet; then
            echo 'No eligible changes to publish'
          else
            git commit -m 'Update modeled NBA projections from connected research'
            git push origin HEAD:main
          fi
