name: Sync completed NBA boxscores and grade model
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_final_boxscores.py'
      - 'track_model.py'
      - 'test_nba_identity_guard.py'
      - 'evaluate_nba_model.py'
      - '.github/workflows/propedge_nba_gamelog_sync.yml'
permissions:
  contents: write
concurrency:
  group: propedge-web-nba-gamelog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NBA identity regression tests
        run: python -m unittest test_nba_identity_guard.py
      - name: Append completed ESPN boxscores only
        run: python sync_final_boxscores.py
      - name: Grade saved pregame predictions against completed games
        run: PROPEDGE_CAPTURE_IF_DUE=1 python track_model.py
      - name: Evaluate settled predictions and shadow challenger
        run: python evaluate_nba_model.py
      - name: Commit validated game logs and grades
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_2026_27.csv data/model_tracking.json data/nba_model_evaluation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync final NBA boxscores and model grades'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No new final boxscores or grades'
          fi
      - name: Request Render refresh when deployment hook is configured
        if: ${{ success() && steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            curl --fail --silent --show-error --max-time 20 -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo 'No Render deploy hook configured; relying on connected GitHub auto-deploy'
          fi
