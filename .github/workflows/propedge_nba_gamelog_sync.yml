name: Sync completed NBA boxscores and grade model
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_final_boxscores.py'
      - '.github/workflows/propedge_nba_gamelog_sync.yml'
permissions:
  contents: write
concurrency:
  group: propedge-web-nba-gamelog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append completed ESPN boxscores only
        run: python sync_final_boxscores.py
      - name: Grade saved pregame predictions against completed games
        run: PROPEDGE_GRADE_ONLY=1 python track_model.py
      - name: Commit validated game logs and grades
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_2026_27.csv data/model_tracking.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync final NBA boxscores and model grades'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new final boxscores or grades'
          fi
